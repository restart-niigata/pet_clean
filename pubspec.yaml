name: pet_clean
description: Pet Clean app
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  camera: 0.11.2
  google_mobile_ads: 6.0.0
  share_plus: 11.1.0
  path_provider: 2.1.5
  shared_preferences: 2.5.3
  webview_flutter: 4.13.0
  screenshot: 3.0.0
  cupertino_icons: 1.0.5
  url_launcher: ^6.3.2
  http: ^1.4.0

dev_dependencies:
  flutter_lints: 6.0.0
  test: ^1.25.15

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/comments.json
